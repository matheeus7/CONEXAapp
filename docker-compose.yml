# Desenvolvimento: PostgreSQL + aplicação.  Uso: docker compose up --build
# Em desenvolvimento a aplicação roda em HTTP (perfil "dev"); em produção, use o perfil "prod" atrás de HTTPS.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: conexa
      POSTGRES_USER: conexa
      POSTGRES_PASSWORD: ${DB_SENHA:-conexa}
    ports:
      - "5432:5432"
    volumes:
      - dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conexa"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://db:5432/conexa
      DB_USUARIO: conexa
      DB_SENHA: ${DB_SENHA:-conexa}
    ports:
      - "8080:8080"

volumes:
  dados:
