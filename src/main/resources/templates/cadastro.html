<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/publica :: publica('Criar conta', ~{::conteudo})}">
<body>
<main class="auth-form" id="conteudo" tabindex="-1" th:fragment="conteudo">
  <div class="caixa">
    <h2>Criar conta</h2>
    <p class="suave" style="margin-bottom:20px">Sua Minha Vida é criada junto, vazia e privada.</p>
    <form th:action="@{/cadastro}" th:object="${cadastroForm}" method="post" novalidate>
      <div class="campo">
        <label for="nome">Nome</label>
        <input type="text" id="nome" th:field="*{nome}" autocomplete="name" required autofocus
               th:attr="aria-invalid=${#fields.hasErrors('nome')} ? 'true', aria-describedby=${#fields.hasErrors('nome')} ? 'erro-nome'">
        <p class="erro" id="erro-nome" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}">Erro</p>
      </div>
      <div class="campo">
        <label for="email">E-mail</label>
        <input type="email" id="email" th:field="*{email}" autocomplete="email" required
               th:attr="aria-invalid=${#fields.hasErrors('email')} ? 'true', aria-describedby=${#fields.hasErrors('email')} ? 'erro-email'">
        <p class="erro" id="erro-email" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">Erro</p>
      </div>
      <div class="campo">
        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" autocomplete="new-password" required aria-describedby="ajuda-senha"
               th:attr="aria-invalid=${#fields.hasErrors('senha')} ? 'true'">
        <span class="ajuda" id="ajuda-senha">Pelo menos 8 caracteres.</span>
        <p class="erro" id="erro-senha" th:if="${#fields.hasErrors('senha')}" th:errors="*{senha}">Erro</p>
      </div>
      <button class="btn primario" type="submit" style="width:100%" data-ocupado="Criando conta…">Criar conta</button>
    </form>
    <p class="auth-troca">Já tem conta? <a th:href="@{/entrar}">Entrar</a></p>
  </div>
</main>
</body>
</html>
