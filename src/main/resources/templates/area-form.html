<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/casca :: casca(${area != null} ? 'Renomear Área' : 'Nova Área', 'areas', ~{::conteudo})}">
<body>
<main class="principal" id="conteudo" tabindex="-1" th:fragment="conteudo">
  <div class="cabeca">
    <div>
      <h1 id="titulo-pagina" th:text="${area != null} ? 'Renomear Área' : 'Nova Área'">Nova Área</h1>
      <p><a th:href="${area != null} ? @{/areas/{id}(id=${area.id})} : @{/areas}">Cancelar</a></p>
    </div>
  </div>
  <section class="painel">
    <div class="painel-corpo">
      <form th:action="${area != null} ? @{/areas/{id}(id=${area.id})} : @{/areas}" th:object="${areaForm}" method="post" novalidate>
        <div class="campo">
          <label for="nome">Nome da Área</label>
          <input type="text" id="nome" th:field="*{nome}" maxlength="80" required autofocus
                 th:attr="aria-invalid=${#fields.hasErrors('nome')} ? 'true', aria-describedby=${#fields.hasErrors('nome')} ? 'erro-nome'">
          <p class="erro" id="erro-nome" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}">Erro</p>
        </div>
        <button class="btn primario" type="submit" data-ocupado="Salvando…">Salvar</button>
      </form>
    </div>
  </section>
</main>
</body>
</html>
