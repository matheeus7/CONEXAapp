<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/casca :: casca('Configurações', 'conta', ~{::conteudo})}">
<body>
<main class="principal" id="conteudo" tabindex="-1" th:fragment="conteudo">
  <div class="cabeca">
    <div>
      <h1 id="titulo-pagina">Configurações</h1>
      <p>Dados da sua conta.</p>
    </div>
  </div>
  <div class="grade dois">
    <section class="painel">
      <div class="painel-cab"><h2>Perfil</h2></div>
      <div class="painel-corpo">
        <form th:action="@{/conta}" th:object="${contaForm}" method="post" novalidate>
          <div class="campo">
            <label for="nome">Nome</label>
            <input type="text" id="nome" th:field="*{nome}" autocomplete="name" required
                   th:attr="aria-invalid=${#fields.hasErrors('nome')} ? 'true', aria-describedby=${#fields.hasErrors('nome')} ? 'erro-nome'">
            <p class="erro" id="erro-nome" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}">Erro</p>
          </div>
          <div class="campo">
            <label for="email">E-mail</label>
            <input type="email" id="email" th:value="${pessoa.email}" readonly aria-describedby="ajuda-email">
            <span class="ajuda" id="ajuda-email">O e-mail identifica sua conta e não pode ser alterado.</span>
          </div>
          <button class="btn primario" type="submit" data-ocupado="Salvando…">Salvar nome</button>
        </form>
      </div>
    </section>
    <section class="painel">
      <div class="painel-cab"><h2>Sessão</h2></div>
      <div class="painel-corpo">
        <p class="suave" style="margin-bottom:14px">Ao sair, será preciso entrar novamente para acessar sua Minha Vida.</p>
        <form class="sair" th:action="@{/sair}" method="post">
          <button class="btn" type="submit"><svg class="icone" aria-hidden="true"><use href="#i-sair"/></svg>Sair da conta</button>
        </form>
      </div>
    </section>
  </div>
</main>
</body>
</html>
