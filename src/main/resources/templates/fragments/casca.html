<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR" th:fragment="casca(titulo, chave, conteudo)"><head th:replace="~{fragments/comum :: cabeca(${titulo})}"></head>
<body>
  <a class="pular" href="#conteudo">Pular para o conteúdo</a>
  <th:block th:replace="~{fragments/icones :: sprite}"></th:block>
  <div class="casca">
    <nav class="nav" aria-label="Navegação principal">
      <a class="marca" th:href="@{/}" aria-label="CONEXA, ir para o Dashboard">
        <span class="marca-sinal"><svg class="icone" aria-hidden="true"><use href="#i-mais"/></svg></span>
        <span class="marca-nome">CONEXA</span>
      </a>
      <div class="nav-lista">
        <a class="item" th:href="@{/}" th:attr="aria-current=${chave == 'dashboard'} ? 'page'"><svg class="icone" aria-hidden="true"><use href="#i-painel"/></svg>Dashboard</a>
        <a class="item" th:href="@{/areas}" th:attr="aria-current=${chave == 'areas'} ? 'page'"><svg class="icone" aria-hidden="true"><use href="#i-pasta"/></svg>Minha Vida</a>
        <a class="item" th:href="@{/calendario}" th:attr="aria-current=${chave == 'calendario'} ? 'page'"><svg class="icone" aria-hidden="true"><use href="#i-calendario"/></svg>Calendário</a>
        <a class="item" th:href="@{/radar}" th:attr="aria-current=${chave == 'radar'} ? 'page'"><svg class="icone" aria-hidden="true"><use href="#i-radar"/></svg>Radar</a>
      </div>
      <div class="nav-rodape">
        <a class="item" th:href="@{/conta}" th:attr="aria-current=${chave == 'conta'} ? 'page'"><svg class="icone" aria-hidden="true"><use href="#i-conta"/></svg>Configurações</a>
        <div class="fraco" style="color:#8fa0c4;padding:0 4px" th:text="${pessoa?.nome}">Nome</div>
      </div>
    </nav>
    <div>
      <div class="topo-movel">
        <a class="marca" th:href="@{/}" aria-label="CONEXA, ir para o Dashboard" style="padding:0">
          <span class="marca-sinal"><svg class="icone" aria-hidden="true"><use href="#i-mais"/></svg></span>
          <span class="marca-nome">CONEXA</span>
        </a>
        <a th:href="@{/conta}" class="avatar" style="text-decoration:none" aria-label="Configurações da conta"
           th:attr="aria-current=${chave == 'conta'} ? 'page'" th:text="${pessoa != null} ? ${#strings.toUpperCase(#strings.substring(pessoa.nome, 0, 1))} : ''">A</a>
      </div>
      <main class="principal" id="conteudo" tabindex="-1" th:replace="${conteudo}">conteúdo</main>
    </div>
    <nav class="nav-movel" aria-label="Navegação principal (celular)">
      <a th:href="@{/}" th:attr="aria-current=${chave == 'dashboard'} ? 'page'"><svg class="icone" aria-hidden="true"><use href="#i-painel"/></svg>Dashboard</a>
      <a th:href="@{/areas}" th:attr="aria-current=${chave == 'areas'} ? 'page'"><svg class="icone" aria-hidden="true"><use href="#i-pasta"/></svg>Vida</a>
      <a th:href="@{/calendario}" th:attr="aria-current=${chave == 'calendario'} ? 'page'"><svg class="icone" aria-hidden="true"><use href="#i-calendario"/></svg>Agenda</a>
      <a th:href="@{/radar}" th:attr="aria-current=${chave == 'radar'} ? 'page'"><svg class="icone" aria-hidden="true"><use href="#i-radar"/></svg>Radar</a>
      <a th:href="@{/conta}" th:attr="aria-current=${chave == 'conta'} ? 'page'"><svg class="icone" aria-hidden="true"><use href="#i-conta"/></svg>Conta</a>
    </nav>
  </div>
  <th:block th:replace="~{fragments/comum :: avisos}"></th:block>
</body>
</html>
