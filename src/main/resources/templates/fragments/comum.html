<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:fragment="cabeca(titulo)">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${titulo} + ' · CONEXA'">CONEXA</title>
  <meta name="description" content="Organize sua vida em áreas privadas e conecte pessoas apenas ao que faz sentido compartilhar.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232D45D6'/%3E%3Cpath d='M9 16h14M16 9v14' stroke='white' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" th:href="@{/css/estilo.css}">
  <script th:src="@{/js/app.js}" defer></script>
</head>
<body>
<div th:fragment="avisos" id="avisos" class="avisos" role="status" aria-live="polite">
  <div class="aviso sucesso" th:if="${aviso}" data-aviso>
    <svg class="icone" aria-hidden="true"><use href="#i-ok"/></svg><span th:text="${aviso}">Feito.</span>
  </div>
</div>
</body>
</html>
